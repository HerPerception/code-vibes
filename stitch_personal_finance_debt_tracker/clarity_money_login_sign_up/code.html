  </head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col justify-between selection:bg-secondary-container selection:text-on-secondary-container"><main class="flex-1 flex flex-col justify-center relative w-full px-margin-screen pt-safe pb-safe bg-surface"><div class="flex flex-col w-full max-w-sm mx-auto my-auto py-space-md">
<!-- Brand Header -->
<div class="flex flex-col items-center text-center mb-space-xl">
<div class="relative w-14 h-14 rounded-xl bg-secondary flex items-center justify-center shadow-md mb-space-sm group">
<div class="absolute inset-0 rounded-xl bg-gradient-to-tr from-secondary to-secondary-container opacity-25"></div>
<span class="material-symbols-outlined text-on-secondary text-28px select-none" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-secondary-container flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
      Clarity Money
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-2xs">
      Simplify your cash flow.
    </p>
</div>
<!-- Interactive Card Container -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col space-y-space-lg">
<!-- Segmented Tab Switcher -->
<div class="w-full p-1 bg-surface-container rounded-full flex relative items-center">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-full shadow-sm transition-all duration-300 ease-out" id="tab-indicator"></div>
<button class="relative flex-1 py-2 text-center font-label-md text-label-md text-on-surface transition-colors duration-200 z-10" id="tab-login" onclick="switchAuthMode('login')" type="button">
        Log In
      </button>
<button class="relative flex-1 py-2 text-center font-label-md text-label-md text-on-surface-variant transition-colors duration-200 z-10" id="tab-signup" onclick="switchAuthMode('signup')" type="button">
        Sign Up
      </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col space-y-space-md" onsubmit="handleAuthSubmit(event)">
<!-- Full Name (Sign Up only) -->
<div class="hidden flex-col space-y-1.5" id="name-field">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#006c4a] transition-all duration-150" id="fullName" placeholder="Alex Rivera" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#006c4a] transition-all duration-150" id="email" placeholder="alex@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<span class="hidden font-label-sm text-label-sm text-on-surface-variant" id="password-hint">Min. 8 characters</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#006c4a] transition-all duration-150" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 p-1 rounded-full text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Context -->
<div class="flex justify-end pt-0.5" id="forgot-password-wrap">
<button class="font-label-sm text-label-sm text-secondary hover:underline transition-all" type="button">
          Forgot Password?
        </button>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-12 rounded-xl bg-secondary text-on-secondary font-label-lg text-label-lg font-semibold flex items-center justify-center shadow-sm active:scale-[0.99] hover:opacity-95 transition-transform duration-100 mt-space-xs" id="submit-button" type="submit">
<span id="submit-text">Sign In</span>
<span class="material-symbols-outlined ml-1.5 text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Social Login Section -->
<div class="flex flex-col space-y-space-md pt-1">
<div class="flex items-center space-x-3">
<div class="flex-1 h-px bg-surface-container"></div>
<span class="font-label-sm text-label-sm text-outline-variant uppercase tracking-wider">or continue with</span>
<div class="flex-1 h-px bg-surface-container"></div>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<!-- Apple Social Button -->
<button aria-label="Continue with Apple" class="h-11 rounded-xl bg-surface-container-low hover:bg-surface-container flex items-center justify-center space-x-2 active:scale-[0.98] transition-all duration-150" type="button">
<svg class="w-4 h-4 fill-current text-on-surface" viewbox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.67-7.81-11.96-14.34-5.91-9.06-10.4-19.16-13.46-30.3-3.06-11.14-4.59-21.78-4.59-31.91 0-14.63 3.65-26.6 10.96-35.91 7.31-9.31 16.48-14.07 27.5-14.28 4.88 0 10.37 1.25 16.48 3.76 6.11 2.51 10.02 3.82 11.73 3.94 1.71-.12 5.86-1.5 12.44-4.14 6.59-2.65 12.33-3.85 17.23-3.6 12.87.64 23.36 5.43 31.47 14.37-11.25 6.83-16.76 16.29-16.53 28.38.23 9.42 3.82 17.3 10.77 23.63 6.95 6.33 15.2 10.02 24.75 11.07-2.35 7.15-5.35 14.54-9.01 22.18zM119.22 33.15c0-6.72 2.37-13.06 7.12-19.02 4.75-5.96 10.73-9.98 17.94-12.06.32 2.02.48 4.09.48 6.2 0 6.61-2.48 13.06-7.44 19.34-4.96 6.28-11.02 10.22-18.18 11.82-.21-2.02-.32-4.11-.32-6.28z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
<!-- Google Social Button -->
<button aria-label="Continue with Google" class="h-11 rounded-xl bg-surface-container-low hover:bg-surface-container flex items-center justify-center space-x-2 active:scale-[0.98] transition-all duration-150" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
</div>
</div>
</div>
<!-- Bottom Legal Note -->
<p class="text-center font-body-sm text-body-sm text-outline mt-space-lg px-space-md leading-relaxed">
    By continuing, you agree to our 
    <a class="text-on-surface hover:text-secondary underline decoration-outline-variant underline-offset-2" href="#">Terms of Service</a> 
    and 
    <a class="text-on-surface hover:text-secondary underline decoration-outline-variant underline-offset-2" href="#">Privacy Policy</a>.
  </p>
</div>
<script>
  let currentMode = 'login';

  function switchAuthMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;

    const indicator = document.getElementById('tab-indicator');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const nameField = document.getElementById('name-field');
    const forgotWrap = document.getElementById('forgot-password-wrap');
    const passwordHint = document.getElementById('password-hint');
    const submitText = document.getElementById('submit-text');

    if (mode === 'signup') {
      indicator.style.transform = 'translateX(calc(100% + 8px))';
      tabSignup.classList.remove('text-on-surface-variant');
      tabSignup.classList.add('text-on-surface');
      tabLogin.classList.remove('text-on-surface');
      tabLogin.classList.add('text-on-surface-variant');

      nameField.classList.remove('hidden');
      nameField.classList.add('flex');
      forgotWrap.classList.add('hidden');
      passwordHint.classList.remove('hidden');
      submitText.textContent = 'Create Account';
    } else {
      indicator.style.transform = 'translateX(0px)';
      tabLogin.classList.remove('text-on-surface-variant');
      tabLogin.classList.add('text-on-surface');
      tabSignup.classList.remove('text-on-surface');
      tabSignup.classList.add('text-on-surface-variant');

      nameField.classList.add('hidden');
      nameField.classList.remove('flex');
      forgotWrap.classList.remove('hidden');
      passwordHint.classList.add('hidden');
      submitText.textContent = 'Sign In';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('password-icon');
    const isPassword = passwordInput.type === 'password';

    passwordInput.type = isPassword ? 'text' : 'password';
    passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
  }

  function handleAuthSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById('submit-button');
    const originalText = document.getElementById('submit-text').textContent;
    
    btn.disabled = true;
    btn.classList.add('opacity-80');
    document.getElementById('submit-text').textContent = 'Connecting...';

    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove('opacity-80');
      document.getElementById('submit-text').textContent = originalText;
    }, 1200);
  }
</script></main></body></html>
